<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Countdown Timer</title>
    <style>
      body {
        background-color: rgb(243 244 246);
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 100px;
      }
      #display {
        font-size: 48px;
        margin-bottom: 20px;
      }
      button {
        border-color: aqua;
        color: rgb(7, 123, 181);
        position: relative;
        font-size: 1.875rem;
        padding: 0.75rem 2rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 250ms;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .squishy-classic {
        background-color: #f0f0f0;
        color: #242424;
        border-radius: 0.5rem;
        box-shadow: inset 0 1px 0 0 #f4f4f4, 0 1px 0 0 #efefef,
          0 2px 0 0 #ececec, 0 4px 0 0 #e0e0e0, 0 5px 0 0 #dedede,
          0 6px 0 0 #dcdcdc, 0 7px 0 0 #cacaca, 0 7px 8px 0 #cecece;
      }

      .squishy-classic:hover {
        transform: translateY(4px);
        box-shadow: inset 0 1px 0 0 #f4f4f4, 0 1px 0 0 #efefef,
          0 1px 0 0 #ececec, 0 2px 0 0 #e0e0e0, 0 2px 0 0 #dedede,
          0 3px 0 0 #dcdcdc, 0 4px 0 0 #cacaca, 0 4px 6px 0 #cecece;
      }
      button:hover {
        background-color: #008cba;
        color: white;
      }
      input[type="number"]{
        /* border: 5px #8f1515; */
        border: 3px solid #555;
        border-radius: 5%;
        width: 80px;
        font-size: 18px;
        margin: 0 5px;
        text-align: center;

      }
      input[type="number"]:focus{
        border: 3px solid #555;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <div>
      <input type="number" id="hours" min="0" placeholder="HH" />
      <input type="number" id="minutes" min="0" max="59" placeholder="MM" />
      <input type="number" id="seconds" min="0" max="59" placeholder="SS" />
      <button class="squishy squishy-classic"  onclick="setCountdown()">Set</button>
    </div>

    <div id="display">00:00:00</div>
    <button class="squishy squishy-classic" onclick="startCountdown()">
      Start
    </button>
    <button class="squishy squishy-classic" onclick="pauseCountdown()">
      Pause
    </button>
    <button class="squishy squishy-classic" onclick="resetCountdown()">
      Reset
    </button>

    <script src="timer.js"></script>
  </body>
</html>
